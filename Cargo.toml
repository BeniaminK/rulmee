[package]
name = "lidm"
version = "0.9.0"
edition = "2024"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
nix = { version = "0.29", features = ["fs", "user", "process", "term", "signal", "ioctl", "hostname"] }
serde = { version = "1.0", features = ["derive"] }
rust-ini = "0.21"
freedesktop_entry_parser = "1.3"
freedesktop = "0.0.3"
log = "0.4"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = "0.4"
uzers = "0.12.2"
ratatui = { version = "0.30" }
tui-input = { version = "0.11", features = ["crossterm"] }
pam-client2 = { version = "0.5.5", features = ["serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "tracing-log"] }
tracing-log = "0.2"
toml = "1.1.2"
crossterm = "0.28.1"
serde_ignored = "0.1.14"
signal-hook = "0.3"
strum = "0.28.0"
strum_macros = "0.28.0"

[build-dependencies]
vergen = { version = "9.1", features = ["build", "rustc"] }
vergen-gitcl = "9.1"

